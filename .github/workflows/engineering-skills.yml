name: Engineering skill qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  analytical-reference-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,analysis]'
      - run: python -m pytest -q tests/engineering_skills --junitxml=engineering-skills.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-skills-${{ matrix.python }}
          path: engineering-skills.xml
