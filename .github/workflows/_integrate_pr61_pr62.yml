name: Integrate ECLSS design and evaluation

on:
  push:
    branches:
      - feat/eclss-unified-design-evaluation
    paths:
      - .github/workflows/_integrate_pr61_pr62.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/eclss-unified-design-evaluation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure git
        run: |
          git config user.name "OpenAI Integration Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge and integrate PR61 + PR62
        run: python scripts/_integrate_pr61_pr62.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run integration regression tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/scenario/test_ssos_unified_design_evaluation.py \
            tests/scenario/test_ssos_eclss_loop_evaluation.py \
            tests/scenario/test_ssos_design_tools.py \
            tests/scenario/test_ssos_design_constraints.py \
            tests/scenario/test_ssos_tool_use_design.py \
            tests/scenario/test_ssos_eclss_loop.py \
            tests/environment/test_plant_sim_busy_guard.py
      - name: Remove temporary integration machinery
        run: |
          rm -f scripts/_integrate_pr61_pr62.py
          rm -f .github/workflows/_integrate_pr61_pr62.yml
          git add -A
      - name: Commit integrated implementation
        run: |
          git commit -m "feat(eclss): unify tool-use design with deterministic evaluation"
          git push origin HEAD:feat/eclss-unified-design-evaluation
