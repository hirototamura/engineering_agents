name: Balancing Cube CPU acceptance

on:
  pull_request:
  push:
    branches: [trunk, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mujoco-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native physics and the hash-pinned One-Piece Release wheel
        run: python -m pip install -e '.[dev,mujoco,onepiece]'
      - name: Required CPU physics, SSOT and failure-path checks
        run: |
          python - <<'PY'
          import mujoco, onepiece, scipy
          assert mujoco.__version__ == '3.3.7'
          assert onepiece.__version__ == '0.1.1'
          PY
          python -m pytest -q tests/scenario/test_balancing_cube.py tests/integrations/test_balancing_cube_import.py tests/scenario/test_balancing_cube_memory.py tests/scenario/test_balancing_cube_memory_loop.py tests/scenario/test_balancing_cube_context_budget.py tests/environment/test_mujoco_multi_gpu.py tests/core/test_vllm_context_preflight.py tests/core/test_vllm_trace.py tests/tools/test_report_library.py --junitxml=cube-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('cube-tests.xml').getroot().findall('testsuite')
          assert sum(int(s.get('tests', 0)) for s in suites) >= 87
          assert sum(int(s.get('skipped', 0)) for s in suites) == 0, 'Cube acceptance must not skip missing dependencies'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cube-cpu-tests-${{ matrix.python-version }}
          path: cube-tests.xml
