name: Docs deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - name: Build MkDocs site
        run: python3 -m mkdocs build
      - name: Deploy to docs/ssos-mkdocs branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: docs/ssos-mkdocs
          clean: true
