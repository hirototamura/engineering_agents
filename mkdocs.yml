site_name: Engineering Agents
site_description: Engineering agent teams for system design and verification across domains
docs_dir: docs
exclude_docs: |
  /AGENTS.md
  /_archive/
  /data/
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: Engineering Agents
          theme:
            language: en
            palette:
              - scheme: default
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/brightness-7
                  name: Switch to dark mode
              - scheme: slate
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/brightness-4
                  name: Switch to light mode
          nav:
            - Home: index.md
            - User guide:
              - Overview: users/index.md
              - Quickstart: users/quickstart.md
              - Concepts: users/concepts.md
              - Task guides:
                - Configure a run: users/guides/configure-run.md
                - Connect an LLM: users/guides/llm.md
                - Iterate designs: users/guides/design-iterations.md
                - Inspect results: users/guides/inspect-results.md
                - Use reports: users/guides/reports.md
                - Troubleshooting: users/guides/troubleshooting.md
              - Reference:
                - CLI: users/reference/cli.md
                - Configuration: users/reference/configuration.md
                - Artifacts: users/reference/artifacts.md
              - Scenarios:
                - Overview: users/scenarios/index.md
                - scrubber_degradation:
                  - Overview: users/scenarios/scrubber_degradation/index.md
                  - Configuration: users/scenarios/scrubber_degradation/configuration.md
                  - Run: users/scenarios/scrubber_degradation/running.md
                  - Results: users/scenarios/scrubber_degradation/results.md
                - ssos_eclss_loop:
                  - Overview: users/scenarios/ssos_eclss_loop/index.md
                  - Configuration: users/scenarios/ssos_eclss_loop/configuration.md
                  - Run: users/scenarios/ssos_eclss_loop/running.md
                  - Results: users/scenarios/ssos_eclss_loop/results.md
                - balancing_cube:
                  - Overview: users/scenarios/balancing_cube/index.md
                  - Configuration: users/scenarios/balancing_cube/configuration.md
                  - Run: users/scenarios/balancing_cube/running.md
                  - Results: users/scenarios/balancing_cube/results.md
            - Developer guide:
              - Overview: developers/index.md
              - Set up development: developers/setup.md
              - Contribute: developers/contributing.md
              - Understand the implementation:
                - Architecture: developers/architecture.md
                - Runtime and harness: developers/runtime.md
                - Agents: developers/agents.md
                - Tools and memory: developers/tools-memory.md
                - Evaluation: developers/evaluation.md
                - Records and integrations: developers/records-integrations.md
              - Extend capabilities:
                - Add a scenario: developers/guides/add-scenario.md
                - Change a backend: developers/guides/change-backend.md
                - Add a tool: developers/guides/add-tool.md
                - Change evaluation: developers/guides/change-evaluation.md
              - Internal reference:
                - Execution contracts: developers/reference/execution.md
                - Storage: developers/reference/storage.md
              - Scenarios:
                - Overview: developers/scenarios/index.md
                - scrubber_degradation:
                  - Overview: developers/scenarios/scrubber_degradation/index.md
                  - Implementation: developers/scenarios/scrubber_degradation/implementation.md
                  - Evaluation and regression: developers/scenarios/scrubber_degradation/evaluation.md
                - ssos_eclss_loop:
                  - Overview: developers/scenarios/ssos_eclss_loop/index.md
                  - Implementation: developers/scenarios/ssos_eclss_loop/implementation.md
                  - Evaluation and regression: developers/scenarios/ssos_eclss_loop/evaluation.md
                - balancing_cube:
                  - Overview: developers/scenarios/balancing_cube/index.md
                  - Implementation: developers/scenarios/balancing_cube/implementation.md
                  - Evaluation and regression: developers/scenarios/balancing_cube/evaluation.md
              - Next development:
                - Priorities: developers/development/index.md
                - External scenarios: developers/development/external-scenarios.md
                - Documentation: developers/development/documentation.md
        - locale: ja
          name: 日本語
          build: true
          site_name: Engineering Agents
          theme:
            language: ja
            palette:
              - scheme: default
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/brightness-7
                  name: ダークモード
              - scheme: slate
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/brightness-4
                  name: ライトモード
          nav:
            - ホーム: index.md
            - ユーザーガイド:
              - 概要: users/index.md
              - クイックスタート: users/quickstart.md
              - 基本概念: users/concepts.md
              - 目的別ガイド:
                - 実行条件を設定する: users/guides/configure-run.md
                - LLM を接続する: users/guides/llm.md
                - 設計を反復する: users/guides/design-iterations.md
                - 結果を確認する: users/guides/inspect-results.md
                - レポートを使う: users/guides/reports.md
                - トラブルシューティング: users/guides/troubleshooting.md
              - リファレンス:
                - CLI: users/reference/cli.md
                - 設定: users/reference/configuration.md
                - 成果物: users/reference/artifacts.md
              - シナリオ:
                - 一覧: users/scenarios/index.md
                - scrubber_degradation:
                  - 概要: users/scenarios/scrubber_degradation/index.md
                  - 設定: users/scenarios/scrubber_degradation/configuration.md
                  - 実行: users/scenarios/scrubber_degradation/running.md
                  - 結果の解釈: users/scenarios/scrubber_degradation/results.md
                - ssos_eclss_loop:
                  - 概要: users/scenarios/ssos_eclss_loop/index.md
                  - 設定: users/scenarios/ssos_eclss_loop/configuration.md
                  - 実行: users/scenarios/ssos_eclss_loop/running.md
                  - 結果の解釈: users/scenarios/ssos_eclss_loop/results.md
                - balancing_cube:
                  - 概要: users/scenarios/balancing_cube/index.md
                  - 設定: users/scenarios/balancing_cube/configuration.md
                  - 実行: users/scenarios/balancing_cube/running.md
                  - 結果の解釈: users/scenarios/balancing_cube/results.md
            - 開発者ガイド:
              - 概要: developers/index.md
              - 開発環境: developers/setup.md
              - 貢献方法: developers/contributing.md
              - 実装を理解する:
                - アーキテクチャ: developers/architecture.md
                - 実行とハーネス: developers/runtime.md
                - エージェント: developers/agents.md
                - ツールと記憶: developers/tools-memory.md
                - 評価: developers/evaluation.md
                - 記録と外部連携: developers/records-integrations.md
              - 機能を拡張する:
                - シナリオを追加する: developers/guides/add-scenario.md
                - backend を変更する: developers/guides/change-backend.md
                - ツールを追加する: developers/guides/add-tool.md
                - 評価を変更する: developers/guides/change-evaluation.md
              - 内部リファレンス:
                - 実行契約: developers/reference/execution.md
                - ストレージ: developers/reference/storage.md
              - シナリオ:
                - 一覧: developers/scenarios/index.md
                - scrubber_degradation:
                  - 概要: developers/scenarios/scrubber_degradation/index.md
                  - 実装: developers/scenarios/scrubber_degradation/implementation.md
                  - 評価と回帰検査: developers/scenarios/scrubber_degradation/evaluation.md
                - ssos_eclss_loop:
                  - 概要: developers/scenarios/ssos_eclss_loop/index.md
                  - 実装: developers/scenarios/ssos_eclss_loop/implementation.md
                  - 評価と回帰検査: developers/scenarios/ssos_eclss_loop/evaluation.md
                - balancing_cube:
                  - 概要: developers/scenarios/balancing_cube/index.md
                  - 実装: developers/scenarios/balancing_cube/implementation.md
                  - 評価と回帰検査: developers/scenarios/balancing_cube/evaluation.md
              - 次の開発:
                - 開発課題: developers/development/index.md
                - 外部シナリオ化: developers/development/external-scenarios.md
                - ドキュメント保守: developers/development/documentation.md
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3
validation:
  links:
    not_found: warn
