name: ssos_eclss_loop  # CLI scenario id (`run ssos_eclss_loop`)
description: >
  SSOS ECLSS closed loop. Agents operate ARS/OGS via EclssBackend (Crew Simulation
  replacement). Mock backend for local dev; Ros2EclssBridge for SSOS Docker.
  Mass storage values are kilograms (ROS bridge converts SSOS grams ↔ kg).

simulation:
  steps: 50  # [-] default observation steps (CLI --steps overrides)
  initial_co2_storage_kg: 1.3  # [kg] starting CO2 tank/cabin; plant_sim uses cabin
  initial_o2_storage_kg: 8.0  # [kg] starting O2 tank (above o2_storage_low_kg)
  initial_product_water_l: 80.0  # [L] starting potable water (above product_water_low_l)

backend:
  kind: plant_sim  # mock | plant_sim | ros2 — `ea run ssos_eclss_loop` default; or SSOS_ECLSS_BACKEND
  ros2:
    action_timeout_s: 120.0  # [s] wait for a ROS2 action result
    topic_timeout_s: 15.0  # [s] wait for a telemetry topic sample
    startup_wait_s: 45.0  # [s] wait after launch for SSOS nodes

mock_dynamics:  # LoopMock only; plant_sim / ros2 ignore this block
  co2_growth_kg_per_step: 0.06  # [kg/step] CO2 added each step when ARS does not run
  ars_co2_reduction_kg: 0.35  # [kg] CO2 removed by one ARS action at the reference goal
  # Scales ARS reduction with ArsGoal.initial_co2_mass / this reference (D1).
  ars_reference_co2_mass_kg: 1.8  # [kg] ARS scale = goal.initial_co2_mass / this mass
  sabatier_co2_kg_per_water_kg: 2.0  # [-] LoopMock Sabatier CO2 debit per kg OGS water

thresholds:  # storage bands for health + labeled_rule_base triggers
  co2_storage_high_kg: 2.0  # [kg] HIGH: start ARS
  co2_storage_critical_kg: 8.0  # [kg] CRITICAL; plant_sim dwell: 2 steps then n // 2 once
  o2_storage_low_kg: 6.0  # [kg] LOW: start OGS; plant_sim dwell: 2 steps then −1
  o2_storage_critical_kg: 1.0  # [kg] CRITICAL; plant_sim dwell: 1 step then −2 (omit fallback: low * 0.75)
  product_water_low_l: 50.0  # [L] LOW: start WRS
  product_water_critical_l: 25.0  # [L] CRITICAL (unspecified fallback: product_water_low_l * 0.5)

# Canonical plant_sim parameters (source of truth for occupant count and rates).
# Python PlantSimConfig() defaults remain for unit tests / library construction.
plant_sim:
  time:
    step_seconds: 1200  # [s] metabolism / observation interval (20 min)
    ars_operation_seconds: 4800  # [s] ARS action quantum (nameplate = capacity × this / 86400)
    ogs_operation_seconds: 1200  # [s] OGS action quantum
    wrs_operation_seconds: 1200  # [s] reserved; WRS feed cap is max_feed_l_per_operation
  crew:
    size: 50  # [person] occupant N; must match agents.yaml actor.team.count when actors run
    activity_factor: 1.0  # [-] scales all crew rates (1=nominal, 4=exercise, 0.7=sleep)
    co2_kg_day_person: 1.04  # [kg/day/person] BVAD CO2 generated
    o2_kg_day_person: 0.84  # [kg/day/person] BVAD O2 demanded
    potable_water_kg_day_person: 2.28  # [kg/day/person] BVAD potable water demanded
    urine_kg_day_person: 1.50  # [kg/day/person] urine into the WRS buffer
    condensate_kg_day_person: 0.75  # [kg/day/person] condensate / grey into the WRS buffer
    unrecoverable_water_kg_day_person: 0.03  # [kg/day/person] water that leaves the recovery loop
  ars:
    capacity_kg_day: 4.50  # [kg/day] CO2 removal throughput
    capture_efficiency: 0.83  # [-] fraction of removed CO2 captured (rest is vented)
    reference_goal_co2_kg: 1.80  # [kg] ARS scale = agents ars_goal.initial_co2_mass / this
  ogs:
    max_o2_kg_day: 9.25  # [kg/day] O2 generation cap
  sabatier:
    conversion_efficiency: 1.00  # [-] H2 + captured CO2 → CH4 + H2O
  wrs:
    urine_recovery: 0.98  # [-] potable recovered from urine feed
    grey_recovery: 0.90  # [-] potable recovered from grey / condensate feed
    max_feed_l_per_operation: 10.0  # [L] urine + grey batch cap per WRS action
  operations:
    # Busy guard: a subsystem accepted at step t is occupied for
    # ceil(operation_seconds / step_seconds) steps (ARS 4800/1200 = 4 steps).
    # Commands arriving while busy are rejected with reason=subsystem_busy.
    busy_guard_enabled: true  # [-] set false to restore pre-guard behaviour
  survival:
    enabled: true  # plant_sim only; sensitivity sweep leaves this false
    o2:
      warning_steps: 2  # [steps] consecutive WARNING before loss
      warning_loss: 1  # [person]
      critical_steps: 1  # [steps]
      critical_loss: 2  # [person]
    water:
      warning_steps: 2  # [steps]
      warning_loss: 1  # [person]
      critical_steps: 1  # [steps]
      critical_loss: 1  # [person]
    co2:
      warning_steps: 2  # [steps] consecutive HIGH (below CRITICAL) before loss
      warning_divisor: 4  # once per stay: lost = n // 4
      critical_steps: 2  # [steps]
      critical_divisor: 2  # once per stay: lost = n // 2 (no wipe)

# Post-run capacity design: what the designer may size, and what it costs.
# Coefficients are an exploration model (rack_affine_linear_v1), NOT flight
# hardware estimates. They exist so raising throughput has a price.
design_constraints:
  enabled: true  # if false, candidates are still simulated but never labelled infeasible
  objective:
    # Documents the objective implemented in design_eval; any other value is
    # rejected when the scenario loads, so config and behaviour cannot drift.
    primary: require_full_survival  # clearance line: crew_remaining == crew_initial
    secondary: minimize_resource_footprint  # then CRITICAL dwell → warning → mass → volume → cost
  budgets:
    # Soft caps used for labelling, not a pre-simulation hard stop (§8.1).
    max_total_mass_kg: 4000.0  # [kg] ARS + OGS + WRS installed mass
    max_total_cost_musd: 500.0  # [MUSD] hardware + launch
    max_total_volume_m3: 14.0  # [m3] pressurised volume
  subsystem_bounds:  # engineering range each machine can be built in
    ars:
      min_capacity_kg_day: 4.5  # [kg/day]
      max_capacity_kg_day: 80.0  # [kg/day]
    ogs:
      min_o2_kg_day: 9.25  # [kg/day]
      max_o2_kg_day: 80.0  # [kg/day]
    wrs:
      min_feed_l_per_operation: 1.0  # [L/operation]
      max_feed_l_per_operation: 20.0  # [L/operation]
  sizing_model:
    mode: rack_affine_linear_v1  # subsystem_x = fixed + variable_at_baseline * capacity_ratio
    baseline:  # capacity that the variable_at_baseline coefficients refer to
      ars_capacity_kg_day: 4.5  # [kg/day]
      ogs_max_o2_kg_day: 9.25  # [kg/day]
      wrs_max_feed_l_per_operation: 10.0  # [L/operation]
    mass_kg:  # [kg] fixed = rack, controller, plumbing, redundancy
      ars: {fixed: 180.0, variable_at_baseline: 270.0}
      ogs: {fixed: 250.0, variable_at_baseline: 450.0}
      wrs: {fixed: 300.0, variable_at_baseline: 350.0}
    volume_m3:  # [m3]
      ars: {fixed: 0.8, variable_at_baseline: 1.2}
      ogs: {fixed: 1.0, variable_at_baseline: 1.3}
      wrs: {fixed: 1.2, variable_at_baseline: 1.3}
    hardware_cost_musd:  # [MUSD] hardware + integration, launch excluded
      ars: {fixed: 15.0, variable_at_baseline: 25.0}
      ogs: {fixed: 20.0, variable_at_baseline: 45.0}
      wrs: {fixed: 18.0, variable_at_baseline: 37.0}
    # [MUSD/kg] resupply burden order of magnitude (NASA OIG CRS audits report
    # ~63.2-71.8 kUSD/kg); 55 kUSD/kg is an exploration value, not a quote.
    launch_cost_musd_per_kg: 0.055
  simulation_policy:
    run_invalid_candidates: false  # schema / numeric / out-of-scope variable: never run
    run_over_budget_candidates: true  # over budget still teaches the designer something
    run_out_of_bounds_candidates: true  # same for beyond engineering bounds
    require_in_bounds_final: true  # an unbuildable machine is never adopted
    # Budgets label, they do not filter: at 50 occupants no full-survival design
    # fits, and hiding it would leave the review with nothing to report. An
    # over-budget winner comes back provisional_final for a human to accept.
    require_feasible_final: false
  penalty_weights:  # descriptive design_penalty only; ranking stays lexicographic
    mass: 0.5
    cost: 0.3
    volume: 0.2

# Optional timed fault injection (scenario layer → EclssBackend.set_subsystem_failure).
# Distinct from scrubber anomalies. Off by default; enable via CLI --inject-failures
# or --set inject_failures=true.
inject_failures: false  # if true, apply the schedule below
subsystem_failures:
  - subsystem: ars  # ars | ogs | wrs
    start_step: 10  # [-] inclusive, 0-based
    end_step: 20  # [-] exclusive
  - subsystem: ogs
    start_step: 20  # [-] inclusive, 0-based
    end_step: 30  # [-] exclusive
  - subsystem: wrs
    start_step: 30  # [-] inclusive, 0-based
    end_step: 40  # [-] exclusive

# Deterministic post-run scorecard. These are verification requirements, not
# plant physics and not labeled actor policy. Full scoring requires plant_sim
# with survival enabled. Equal resource weights are explicit for auditability.
evaluation:
  enabled: true
  tcl:
    reference_seconds: 57600  # [s] acceptance horizon (16 h); no future extrapolation
  trajectory:
    resource_weights: {co2: 1.0, o2: 1.0, water: 1.0}
    zero_score_mean_severity: 1.0  # [-] weighted mean severity that maps to 0/10
  resource_recovery:
    resource_weights: {co2: 1.0, o2: 1.0, water: 1.0}
    terminal_weight: 0.5  # [-] remaining 0.5 is worst-to-final recovery
  actor_decision:
    max_latency_steps: 2  # [steps] zero latency gets full response quality
    latency_weight: 0.5  # [-] remaining 0.5 is command validity
    command_bounds:
      air_revitalisation:
        initial_co2_mass: [0.0, 8.0]  # [kg]
      oxygen_generation:
        input_water_mass: [0.0, 1.0]  # [kg]
      water_recovery:
        urine_volume: [0.0, 10.0]  # [L]
      request_co2:
        amount: [0.0, 8.0]  # [kg]
      request_o2:
        amount: [0.0, 8.0]  # [kg]
  physical_response:
    success_weight: 1.0
    conversion_weight: 1.0
    sign_weight: 1.0
  physics_gate:
    inventory_tolerance: 1.0e-9
    ledger_tolerance: 2.0e-6  # [kg or L] permits documented chemistry residual

agents:
  actor:
    mode: labeled_rule_base  # none | labeled_rule_base | llm — `ea run` default; CLI --actor-mode overrides
    # Cap on actions per step (llm and labeled). Rotates from eclss_actor_{step % N}.
    # llm: actors allowed to command after deliberation (clamped to actor.team.count).
    # labeled: needed ARS/OGS/WRS repeats to leave warning/critical, then min(needed, this).
    # request_co2 does not count.
    max_actions_per_step: 6 # [-] llm / labeled cap on commands per step
  design: {}
    # design.mode omitted here so library/tests inherit actor.mode.
    # Bare `ea run ssos_eclss_loop` pins design.mode=llm via CLI defaults.

output:
  run_id: ssos_eclss_loop_baseline  # none/none (or unspecified)
  run_id_labeled_rule_base: ssos_eclss_loop_labeled_rule_base  # both sides labeled
  run_id_llm: ssos_eclss_loop_llm  # both sides llm
  # Mixed actor/design modes use {scenario}_{actor_mode}_{design_mode}.
