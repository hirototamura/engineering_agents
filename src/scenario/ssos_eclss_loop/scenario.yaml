name: ssos_eclss_loop
description: >
  SSOS ECLSS closed loop. Agents operate ARS/OGS via EclssBackend (Crew Simulation
  replacement). Mock backend for local dev; Ros2EclssBridge for SSOS Docker.
  Mass storage values are kilograms (ROS bridge converts SSOS grams ↔ kg).

simulation:
  steps: 50  # decision cycles (observe → deliberate → act)
  # Inventories scaled ~10× vs the 4-crew / 1-rep baseline so 100 operators,
  # max_actions_per_step=10, and 100 steps do not empty O2/water on first barrage.
  # CO2 start stays just below the high band (same relative headroom as 1.3 / 1.5).
  initial_co2_storage_kg: 1.3
  initial_o2_storage_kg: 0.48
  initial_product_water_l: 51.0

backend:
  kind: mock  # mock | plant_sim | ros2 — CLI default is ros2 (requires Docker); override via SSOS_ECLSS_BACKEND
  ros2:
    action_timeout_s: 120.0
    topic_timeout_s: 15.0
    startup_wait_s: 45.0

mock_dynamics:
  co2_growth_kg_per_step: 0.06
  ars_co2_reduction_kg: 0.35
  # Scales ARS reduction with ArsGoal.initial_co2_mass / this reference (D1).
  ars_reference_co2_mass_kg: 1.8
  sabatier_co2_kg_per_water_kg: 2.0

thresholds:
  co2_storage_high_kg: 1.5
  co2_storage_critical_kg: 2.2
  o2_storage_low_kg: 0.45
  # Water low band stays near the old 50 L floor; the 510 L tank is the buffer
  # (10 OGS × 0.15 L × 100 steps ≈ 150 L draw).
  product_water_low_l: 50.0

# Optional timed fault injection (scenario layer → EclssBackend.set_subsystem_failure).
# Distinct from scrubber anomalies:. Off by default; enable via CLI --inject-failures
# or --set inject_failures=true.
inject_failures: false
subsystem_failures:
  - subsystem: ars           # ars | ogs | wrs
    start_step: 10           # inclusive, 0-based
    end_step: 20             # optional, exclusive
  - subsystem: ogs
    start_step: 20
    end_step: 30       
  - subsystem: wrs
    start_step: 30
    end_step: 40       
    
agents:
  mode: none  # none | labeled_rule_base | llm
  # After llm deliberation, this many agents may issue operational commands.
  # Rotates from eclss_operator_{step % N}. Clamped to team.count. labeled_rule_base ignores this.
  max_actions_per_step: 2

output:
  run_id: ssos_eclss_loop_baseline
  run_id_labeled_rule_base: ssos_eclss_loop_labeled_rule_base
  run_id_llm: ssos_eclss_loop_llm
