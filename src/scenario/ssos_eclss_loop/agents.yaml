# ssos_eclss_loop — SSOS ECLSS operator team (Crew Simulation replacement)

mode: labeled_rule_base

memory_limit: 1000
discourse_window: 12

team:
  count: 4
  id_prefix: eclss_operator
  persona: |
    SSOS ECLSS operator engineer. Read storage telemetry (/co2_storage, /o2_storage);
    coordinate ARS air_revitalisation and OGS oxygen_generation via backend actions.
    Sabatier CO2 feedstock is normally left to OGS (internal /ars/request_co2); issue an
    explicit request_co2 before OGS only when policy request_co2_before_ogs is true.
    No topology changes at runtime.

# policy: labeled_rule_base operational profiles only.
# Band thresholds (co2_storage_high_kg, o2_storage_low_kg, …) are derived from
# scenario.yaml thresholds at run time — do not duplicate them here.
# Mass fields are kilograms; water volumes are liters.
# request_co2_before_ogs defaults off: real SSOS OGS already calls /ars/request_co2
# internally for Sabatier; an explicit pre-request would double-withdraw CO₂.
# If set true (opt-in / design proposal), LoopMock has no CO₂ buffer between the
# explicit request_co2 and OGS Sabatier debit, so the same step can debit twice.
policy:
  request_co2_before_ogs: false
  request_co2_amount: 0.025
  wrs_feed_trigger_l: 0.5
  ars_goal:
    initial_co2_mass: 1.8
    initial_moisture_content: 25.0
    initial_contaminants: 5.0
  ogs_goal:
    # SHAKEOUT tuning: one-shot OGS latch only re-fires ~every other step, so the
    # per-action water must cover >1 step of 4-crew O2 demand or O2 starves to 0.
    # 0.15 kg holds O2 in the safe band. Post-merge: decouple action duration (B4)
    # or make OGS re-fire every step while below band, then right-size this.
    input_water_mass: 0.15
    iodine_concentration: 2.0
  wrs_goal:
    urine_volume: 2.0

llm:
  # ollama (local daemon) or vllm (lab GPU server: https://github.com/hirototamura/vllm_server)
  provider: ollama
  # Host Ollama: localhost. In SSOS Docker use host.docker.internal (ea-loop sets OLLAMA_BASE_URL).
  # Lab vLLM: --llm-provider vllm (or LLM_PROVIDER=vllm). Defaults to http://10.10.0.108:8000/v1 / qwen3-8b.
  # max_concurrency: 100  # in-flight cap; omit for provider/model defaults
  base_url: http://localhost:11434
  model: qwen3.5:9b
  temperature: 0.45
  max_tokens: 512
  repeat_penalty: 1.1
  repeat_last_n: 128
  min_p: 0.05
  think: false
  api_timeout: 20
