# ssos_eclss_loop — actor (runtime ops) and designer (post-run) teams

actor:
  team:
    count: 50  # [person] actor N; must match scenario.yaml plant_sim.crew.size for plant_sim
    id_prefix: eclss_actor  # ids are eclss_actor_1 .. N
    persona: |
      SSOS ECLSS actor. Read storage telemetry (/co2_storage, /o2_storage);
      coordinate ARS air_revitalisation and OGS oxygen_generation via backend actions.
      Sabatier CO2 feedstock is normally left to OGS (internal /ars/request_co2); issue an
      explicit request_co2 before OGS only when policy request_co2_before_ogs is true.
      No topology changes at runtime.
  # Per-agent private entries (not steps). llm commit writes ~2–3 strings per
  # step (optional JSON "memory", message+reasoning summary, plus own commands).
  # 30 keeps the newest ~10–15 steps of private recall (vLLM prompt budget).
  memory_limit: 30  # [-] max memories kept per actor
  # Team discourse is a sliding window of AgentMessage objects. One llm step
  # emits ~count deliberation messages + max_actions_per_step action/skip
  # messages (~52 with count 50 and 2 action reps). 22 is a vLLM prompt budget
  # (less than one full 50-person step) so actors can still cite recent
  # teammates (same-step deliberation is still simultaneous).
  discourse_window: 22  # [-] recent utterances visible to each actor
  # policy: labeled_rule_base operational profiles only (llm does not read these).
  # Storage-band triggers come from scenario.yaml thresholds at run time — do not duplicate them here.
  # Mass fields are kilograms; water volumes are liters.
  policy:
    request_co2_before_ogs: false  # if true, explicit /ars/request_co2 before OGS (can double-debit on LoopMock)
    request_co2_amount: 0.025  # [kg] CO2 requested when the flag above is true
    wrs_feed_trigger_l: 5.0  # [L] start WRS when urine+grey buffer ≥ this
    ars_goal:  # air_revitalisation payload
      initial_co2_mass: 4.50  # [kg] plant_sim ARS scale = this / plant_sim.ars.reference_goal_co2_kg
      initial_moisture_content: 25.0  # [%] 0–100; plant_sim ignores, ROS2 forwards
      initial_contaminants: 5.0  # [%] 0–100; plant_sim ignores, ROS2 forwards
    ogs_goal:  # oxygen_generation payload
      # Nameplate-sized request (~ogs_max_o2_kg_day × ogs_operation_seconds), not per-crew demand.
      input_water_mass: 0.15  # [kg] water into electrolysis per OGS action
      iodine_concentration: 2.0  # [mg/L] plant_sim ignores, ROS2 forwards
    wrs_goal:  # water_recovery_systems payload
      urine_volume: 0.5  # [L] urine requested per WRS action (capped by buffer and max_feed)
  llm:
    # Current default: lab vLLM (https://github.com/hirototamura/vllm_server).
    # Switch to ollama with provider: ollama, a local tag, and base_url http://localhost:11434.
    # Actor and design URLs are independent — VLLM_BASE_URL stamps both sides.
    provider: vllm  # ollama | vllm
    base_url: http://10.10.0.108:8000/v1  # 8B; 32B is :8001/v1
    model: qwen3.5-9b  # current default; may change
    temperature: 0.45  # [-] sampling temperature
    max_tokens: 768  # [-] max completion tokens (vLLM prompt fit)
    think: false  # if true, request model chain-of-thought (provider-dependent)
    api_timeout: 20  # [s] HTTP timeout; Ollama only — vLLM ignores this

design:
  # design.mode omitted: inherit actor.mode for library/tests.
  # Bare `ea run ssos_eclss_loop` pins design.mode=llm via CLI defaults.
  team:
    # One designer, no thinking lens. The three lenses sit on the audit panel
    # below, not on this roster. Classic (non tool-use) LLM design still
    # deliberates whoever is listed here.
    count: 1
    id_prefix: eclss_designer
    archetypes: []
    # Empty => derived from the objective (survival, then less CRITICAL, then smaller).
    bias_direction: ""
    persona: |
      Post-run ECLSS capacity design engineer. The run is over: size the next
      build. You are shown where the design stands and you answer one thing:
      the sizing to try next, or that you are finished. Every candidate you
      name is checked, re-simulated, audited and compared for you before you
      are asked again. Do not judge pass/fail.
  # Three independent auditors, after the designer. Each sees the same
  # proposal and none of the others. They may only approve or reject; they
  # cannot invent a machine. The three write-ups are then merged.
  audit:
    enabled: true
    count: 3
    id_prefix: eclss_auditor
    archetypes:
      - rederive_numbers
      - avoid_local_optima
      - design_validity
    persona: ""  # empty => lens text only
  tool_use:
    # Design decision loop (design doc §5, §10). Only active when design.mode is llm.
    enabled: true  # false = classic summary-only post-run design proposal
    max_candidate_runs: 1  # [-] candidate re-simulations allowed per review
    decision_loop:
      # One design per round. The search happens across the chain, not inside a
      # single round: an earlier build explored four sizings per round, threw
      # three of them away, and passed only the winner on, so the chain learned
      # from a tenth of what it had paid to simulate.
      #
      # Asking the model is the only slow step in the loop (about seventy
      # seconds against three seconds for all nine tools together), so the
      # question is what is budgeted, and a repair counts against it. Spending
      # the budget is the normal ending: the verified design is adopted and
      # handed to the next round.
      max_decisions: 2  # [-] design decisions per review
      max_llm_calls: 2  # [-] questions per review, repairs included
      max_parse_retries: 1  # [-] repair attempts, charged to max_llm_calls
    # Candidate validation is not a knob: the Evidence Gate always requires a
    # re-simulated candidate, and the adopted fields always come from its record.
    # Actor mode inside candidate runs: inherit keeps the baseline crew. Use
    # labeled_rule_base to score candidates cheaply when the crew is an LLM team.
    candidate_actor_mode: inherit  # inherit | labeled_rule_base | llm | none
    plots_enabled: true  # render PNG timeseries next to the numeric features
    llm:
      # Merged over design.llm for decision turns only. A turn emits one small
      # JSON object; with design.llm's 16384 budget the 27B model spends it all
      # on thinking and can pass the 300 s HTTP timeout (empty reply). This
      # keeps a turn at roughly 40-70 s and still leaves room for the final
      # proposal, which is the longest reply of the loop.
      max_tokens: 6144  # [-] completion budget per decision turn (~40-70 s)
  llm:
    provider: vllm
    base_url: http://10.10.0.108:8001/v1  # independent of actor; 32B is :8001/v1
    model: qwen3.8-27b-uncensored
    temperature: 0.45
    max_tokens: 16384  # self-hosted lab vLLM; generous thinking + multi-change JSON
    think: true
    api_timeout: 20
